# The operator's RustFS client against a real RustFS (NO3b-2): the version of
# the dev stack (NR4), pinned by digest, with TLS on (a CA and server
# certificate generated in the job) and the client verifying the certificate
# chain and host name. The tests are test/integration (build tag
# `integration`); the certificates and the admin credentials come from the
# same script the devcontainer stack uses (test/integration/gen-certs.sh).
#
# The AWS store (NKs3-1a buckets, NKs3-1b IAM users, policies and access keys):
# moto server in a second job. moto is an emulator and is never linked; it
# cannot check IAM eventual consistency (a new user or key is visible at once),
# that a permissions boundary or a policy really limits what a key can do (it
# does not enforce IAM), or real STS web identity (it does not validate tokens),
# so those stay unverified by CI.
#
# The GCS store (NKs3-2a buckets): fake-gcs-server in a third job. It keeps a
# bucket's name and versioning only (labels, lifecycle rules, the location and
# the IAM configuration are accepted and dropped), enforces no IAM and validates
# no token, and has no service accounts, bucket IAM policies or HMAC keys, so the ownership label,
# the lifecycle rules, a refused credential and everything BucketAccess on GCP
# will need stay unverified by CI.
#
# Instance-owned: listed in .github/template-sync-manifest.local.yml, so
# template sync never replaces it. A step-started container rather than a
# `services:` container, because a service container starts before the
# checkout and so cannot be handed the generated certificates.
name: Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=docker depName=rustfs/rustfs
  RUSTFS_IMAGE: rustfs/rustfs:1.0.0-rc.5-glibc@sha256:d14642b8ade7438d75543a357ef2c9dfa7ac06575995163fc692642a24816a51
  # moto server (Apache-2.0): the S3 and STS calls of the AWS store. Tested by
  # tag and digest; an emulator, never linked (plan Track NK). The digest of
  # operator-db's moto job.
  # renovate: datasource=docker depName=motoserver/moto
  MOTO_IMAGE: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
  # fake-gcs-server (BSD-2-Clause): the bucket calls of the GCS store. Tested by
  # tag and digest; an emulator, never linked (plan Track NK).
  # renovate: datasource=docker depName=fsouza/fake-gcs-server
  FAKE_GCS_IMAGE: fsouza/fake-gcs-server:1.56.1@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
  # The version scripts/develop.d/10-go.sh installs for the checks lane.
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: 2.15.0

jobs:
  rustfs:
    name: RustFS with TLS
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The checks lane lints with the default build tags, so test/integration
      # (build tag `integration`) is only compiled and linted here. Same
      # release, checksum-verified like scripts/develop.d/10-go.sh, and the
      # repository's .golangci.yml.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          dir="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          base="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          tmp="$RUNNER_TEMP/golangci-lint"
          mkdir -p "$tmp"
          curl -LsSf -o "$tmp/$dir.tar.gz" "$base/$dir.tar.gz"
          curl -LsSf -o "$tmp/checksums.txt" "$base/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt"
          (cd "$tmp" && awk -v f="$dir.tar.gz" '$2 == f' checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$dir.tar.gz" -C "$tmp"
          echo "$tmp/$dir" >> "$GITHUB_PATH"

      - name: Lint the integration tests
        run: golangci-lint run --build-tags integration ./test/integration/...

      - name: Generate the CA, the server certificate and the admin credentials
        run: |
          set -euo pipefail
          test/integration/gen-certs.sh "$RUNNER_TEMP/rustfs-tls"
          echo "::add-mask::$(cat "$RUNNER_TEMP/rustfs-tls/admin-access-key")"
          echo "::add-mask::$(cat "$RUNNER_TEMP/rustfs-tls/admin-secret-key")"

      - name: Start RustFS with TLS
        run: |
          set -euo pipefail
          docker run -d --name rustfs -p 127.0.0.1:9000:9000 \
            -v "$RUNNER_TEMP/rustfs-tls:/tls:ro" \
            -e RUSTFS_TLS_PATH=/tls \
            -e RUSTFS_ACCESS_KEY_FILE=/tls/admin-access-key \
            -e RUSTFS_SECRET_KEY_FILE=/tls/admin-secret-key \
            -e RUSTFS_CONSOLE_ENABLE=false \
            "$RUSTFS_IMAGE"
          for _ in $(seq 1 90); do
            if curl -fsS --cacert "$RUNNER_TEMP/rustfs-tls/ca.crt" https://localhost:9000/health; then exit 0; fi
            sleep 1
          done
          docker logs rustfs
          echo "RustFS did not become ready" >&2
          exit 1

      - name: Run the integration tests
        run: |
          set -euo pipefail
          export S3_ENDPOINT=https://localhost:9000
          export S3_CA_FILE="$RUNNER_TEMP/rustfs-tls/ca.crt"
          export S3_ADMIN_ACCESS_KEY_FILE="$RUNNER_TEMP/rustfs-tls/admin-access-key"
          export S3_ADMIN_SECRET_KEY_FILE="$RUNNER_TEMP/rustfs-tls/admin-secret-key"
          go test -tags integration -race -count=1 -v -timeout 15m \
            -coverpkg=./internal/s3client/ -coverprofile="$RUNNER_TEMP/integration.cover" \
            ./test/integration/...
          go tool cover -func="$RUNNER_TEMP/integration.cover" | tail -n 1

      - name: Show the server log
        if: failure()
        run: docker logs rustfs

      - name: Remove the server
        if: always()
        run: docker rm -f rustfs

  moto:
    name: AWS store (moto)
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Same release and checksum check as the RustFS job; the moto tests have
      # their own build tag, so they are linted here.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          dir="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          base="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          tmp="$RUNNER_TEMP/golangci-lint"
          mkdir -p "$tmp"
          curl -LsSf -o "$tmp/$dir.tar.gz" "$base/$dir.tar.gz"
          curl -LsSf -o "$tmp/checksums.txt" "$base/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt"
          (cd "$tmp" && awk -v f="$dir.tar.gz" '$2 == f' checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$dir.tar.gz" -C "$tmp"
          echo "$tmp/$dir" >> "$GITHUB_PATH"

      - name: Lint the moto tests
        run: golangci-lint run --build-tags integration,moto ./test/integration/...

      # moto is reached at its address on the default bridge network (a private
      # range), never at loopback: pkg/egress blocks loopback in both modes.
      # EGRESS_MODE=allow-private is in the test's own wiring (the egress it
      # builds), not in the operator's configuration.
      - name: Start moto
        run: |
          set -euo pipefail
          docker run -d --name moto "$MOTO_IMAGE"
          moto_ip=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' moto)
          echo "MOTO_IP=$moto_ip" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -fsS "http://$moto_ip:5000/moto-api/" >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs moto
          echo "moto did not become ready" >&2
          exit 1

      - name: Run the AWS store tests
        run: |
          set -euo pipefail
          export MOTO_ENDPOINT="http://$MOTO_IP:5000"
          go test -tags integration,moto -race -count=1 -v -timeout 10m -run 'TestMoto' ./test/integration/...

      - name: Show the server log
        if: failure()
        run: docker logs moto

      - name: Remove the server
        if: always()
        run: docker rm -f moto

  fake-gcs:
    name: GCS store (fake-gcs-server)
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Same release and checksum check as the RustFS job; the GCS tests have
      # their own build tag, so they are linted here.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          dir="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          base="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          tmp="$RUNNER_TEMP/golangci-lint"
          mkdir -p "$tmp"
          curl -LsSf -o "$tmp/$dir.tar.gz" "$base/$dir.tar.gz"
          curl -LsSf -o "$tmp/checksums.txt" "$base/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt"
          (cd "$tmp" && awk -v f="$dir.tar.gz" '$2 == f' checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$dir.tar.gz" -C "$tmp"
          echo "$tmp/$dir" >> "$GITHUB_PATH"

      - name: Lint the GCS tests
        run: golangci-lint run --build-tags integration,gcs ./test/integration/...

      # The emulator is reached at its address on the default bridge network (a
      # private range), never at loopback: pkg/egress blocks loopback in both
      # modes. EGRESS_MODE=allow-private is in the test's own wiring (the egress
      # it builds), not in the operator's configuration.
      - name: Start fake-gcs-server
        run: |
          set -euo pipefail
          docker run -d --name fake-gcs "$FAKE_GCS_IMAGE" -backend memory -scheme http -port 4443
          gcs_ip=$(docker inspect -f '{{.NetworkSettings.IPAddress}}' fake-gcs)
          echo "FAKE_GCS_IP=$gcs_ip" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -fsS "http://$gcs_ip:4443/storage/v1/b?project=test-project" >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs fake-gcs
          echo "fake-gcs-server did not become ready" >&2
          exit 1

      - name: Run the GCS store tests
        run: |
          set -euo pipefail
          export FAKE_GCS_ENDPOINT="http://$FAKE_GCS_IP:4443"
          go test -tags integration,gcs -race -count=1 -v -timeout 10m -run 'TestGCS' ./test/integration/...

      - name: Show the server log
        if: failure()
        run: docker logs fake-gcs

      - name: Remove the server
        if: always()
        run: docker rm -f fake-gcs
