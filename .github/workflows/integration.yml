# The operator's RustFS client against a real RustFS (NO3b-2): the version of
# the dev stack (NR4), pinned by digest, with TLS on (a CA and server
# certificate generated in the job) and the client verifying the certificate
# chain and host name. The tests are test/integration (build tag
# `integration`); the certificates and the admin credentials come from the
# same script the devcontainer stack uses (test/integration/gen-certs.sh).
#
# Instance-owned: listed in .github/template-sync-manifest.local.yml, so
# template sync never replaces it. A step-started container rather than a
# `services:` container, because a service container starts before the
# checkout and so cannot be handed the generated certificates.
name: Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=docker depName=rustfs/rustfs
  RUSTFS_IMAGE: rustfs/rustfs:1.0.0-rc.5-glibc@sha256:d14642b8ade7438d75543a357ef2c9dfa7ac06575995163fc692642a24816a51
  # The version scripts/develop.d/10-go.sh installs for the checks lane.
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: 2.15.0

jobs:
  rustfs:
    name: RustFS with TLS
    # renovate: datasource=github-runners depName=ubuntu
    runs-on: ${{ vars.CI_RUNNER_AMD64 || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The checks lane lints with the default build tags, so test/integration
      # (build tag `integration`) is only compiled and linted here. Same
      # release, checksum-verified like scripts/develop.d/10-go.sh, and the
      # repository's .golangci.yml.
      - name: Install golangci-lint
        run: |
          set -euo pipefail
          dir="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          base="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          tmp="$RUNNER_TEMP/golangci-lint"
          mkdir -p "$tmp"
          curl -LsSf -o "$tmp/$dir.tar.gz" "$base/$dir.tar.gz"
          curl -LsSf -o "$tmp/checksums.txt" "$base/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt"
          (cd "$tmp" && awk -v f="$dir.tar.gz" '$2 == f' checksums.txt | sha256sum -c -)
          tar -xzf "$tmp/$dir.tar.gz" -C "$tmp"
          echo "$tmp/$dir" >> "$GITHUB_PATH"

      - name: Lint the integration tests
        run: golangci-lint run --build-tags integration ./test/integration/...

      - name: Generate the CA, the server certificate and the admin credentials
        run: |
          set -euo pipefail
          test/integration/gen-certs.sh "$RUNNER_TEMP/rustfs-tls"
          echo "::add-mask::$(cat "$RUNNER_TEMP/rustfs-tls/admin-access-key")"
          echo "::add-mask::$(cat "$RUNNER_TEMP/rustfs-tls/admin-secret-key")"

      - name: Start RustFS with TLS
        run: |
          set -euo pipefail
          docker run -d --name rustfs -p 127.0.0.1:9000:9000 \
            -v "$RUNNER_TEMP/rustfs-tls:/tls:ro" \
            -e RUSTFS_TLS_PATH=/tls \
            -e RUSTFS_ACCESS_KEY_FILE=/tls/admin-access-key \
            -e RUSTFS_SECRET_KEY_FILE=/tls/admin-secret-key \
            -e RUSTFS_CONSOLE_ENABLE=false \
            "$RUSTFS_IMAGE"
          for _ in $(seq 1 90); do
            if curl -fsS --cacert "$RUNNER_TEMP/rustfs-tls/ca.crt" https://localhost:9000/health; then exit 0; fi
            sleep 1
          done
          docker logs rustfs
          echo "RustFS did not become ready" >&2
          exit 1

      - name: Run the integration tests
        run: |
          set -euo pipefail
          export S3_ENDPOINT=https://localhost:9000
          export S3_CA_FILE="$RUNNER_TEMP/rustfs-tls/ca.crt"
          export S3_ADMIN_ACCESS_KEY_FILE="$RUNNER_TEMP/rustfs-tls/admin-access-key"
          export S3_ADMIN_SECRET_KEY_FILE="$RUNNER_TEMP/rustfs-tls/admin-secret-key"
          go test -tags integration -race -count=1 -v -timeout 15m \
            -coverpkg=./internal/s3client/ -coverprofile="$RUNNER_TEMP/integration.cover" \
            ./test/integration/...
          go tool cover -func="$RUNNER_TEMP/integration.cover" | tail -n 1

      - name: Show the server log
        if: failure()
        run: docker logs rustfs

      - name: Remove the server
        if: always()
        run: docker rm -f rustfs
