# This rule is not used by the project operator-s3 itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the s3.craftainer.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator-s3
    app.kubernetes.io/managed-by: kustomize
  name: clusterobjectstore-editor-role
rules:
- apiGroups:
  - s3.craftainer.dev
  resources:
  - clusterobjectstores
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - s3.craftainer.dev
  resources:
  - clusterobjectstores/status
  verbs:
  - get
