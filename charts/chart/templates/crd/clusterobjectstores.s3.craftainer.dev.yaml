{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: clusterobjectstores.s3.craftainer.dev
spec:
  group: s3.craftainer.dev
  names:
    categories:
    - craftainer
    kind: ClusterObjectStore
    listKind: ClusterObjectStoreList
    plural: clusterobjectstores
    singular: clusterobjectstore
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterObjectStore is a cluster-scoped object store that the namespaces in
          allowedNamespaces may claim from.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ClusterObjectStore
            properties:
              adminCredentialsSecretRef:
                description: |-
                  AdminCredentialsSecretRef names the data-plane admin credentials. Unset
                  on a server that logs in with its cloud identity.
                properties:
                  key:
                    description: Key limits the credentials to one key of the Secret.
                    maxLength: 253
                    type: string
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace is required on a cluster server (the operator namespace) and
                      forbidden on a namespaced one; the operator's own CEL enforces that.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              allowedNamespaces:
                description: |-
                  allowedNamespaces says which namespaces may claim from this store. It is
                  required, so a store without it is rejected: it fails closed.
                properties:
                  from:
                    description: From selects All namespaces or those matching Selector.
                    enum:
                    - All
                    - Selector
                    type: string
                  selector:
                    description: Selector is required if and only if From is Selector.
                    properties:
                      matchExpressions:
                        description: MatchExpressions are label requirements, ANDed.
                        items:
                          description: |-
                            LabelSelectorRequirement mirrors metav1.LabelSelectorRequirement with the
                            bounds CEL cost estimation needs.
                          properties:
                            key:
                              description: Key is the label key.
                              maxLength: 253
                              minLength: 1
                              type: string
                            operator:
                              description: Operator relates the key to the values.
                              enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                              type: string
                            values:
                              description: Values are the label values for In and
                                NotIn.
                              items:
                                maxLength: 63
                                type: string
                              maxItems: 20
                              type: array
                          required:
                          - key
                          - operator
                          type: object
                        maxItems: 20
                        type: array
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: MatchLabels requires each key to have the value.
                        maxProperties: 20
                        type: object
                    type: object
                required:
                - from
                type: object
                x-kubernetes-validations:
                - message: selector must not be set when from is All
                  rule: self.from != 'All' || !has(self.selector)
                - message: selector is required when from is Selector
                  rule: self.from != 'Selector' || has(self.selector)
                - message: 'selector must have matchLabels or matchExpressions; use
                    from: All to allow every namespace'
                  rule: 'self.from != ''Selector'' || !has(self.selector) || (has(self.selector.matchLabels)
                    ? size(self.selector.matchLabels) : 0) + (has(self.selector.matchExpressions)
                    ? size(self.selector.matchExpressions) : 0) > 0'
              backend:
                description: |-
                  backend is the object store implementation (default RustFS). Self-hosted
                  stores only.
                enum:
                - RustFS
                type: string
              credentials:
                description: |-
                  credentials is the cloud credential: the operator's own identity
                  (WorkloadIdentity, the default) or a Secret in the operator's namespace.
                properties:
                  secretRef:
                    description: SecretRef is required if and only if Source is Secret.
                    properties:
                      name:
                        description: Name is the Secret's name.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace is the Secret's namespace: required on a cluster server (the
                          controller accepts only the operator's own namespace), forbidden on a
                          namespaced one.
                        maxLength: 63
                        type: string
                    required:
                    - name
                    type: object
                  source:
                    default: WorkloadIdentity
                    description: Source is WorkloadIdentity (default) or Secret.
                    enum:
                    - WorkloadIdentity
                    - Secret
                    type: string
                required:
                - source
                type: object
                x-kubernetes-validations:
                - message: secretRef is required when source is Secret and forbidden
                    otherwise
                  rule: 'self.source == ''Secret'' ? has(self.secretRef) : !has(self.secretRef)'
                - message: secretRef.namespace is required on a cluster server
                  rule: self.source != 'Secret' || !has(self.secretRef) || has(self.secretRef.namespace)
              endpoint:
                description: |-
                  endpoint is the https URL of the store; the admin API is under it.
                  Required without a provider; with one it is an optional override of the
                  discovered address.
                maxLength: 512
                type: string
                x-kubernetes-validations:
                - message: endpoint must be an https URL
                  rule: self.startsWith('https://')
              healthCheckInterval:
                description: |-
                  HealthCheckInterval is how often the server is probed (default 1m,
                  minimum 10s, maximum 1h).
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: healthCheckInterval must be between 10s and 1h
                  rule: duration(self) >= duration('10s') && duration(self) <= duration('1h')
              pathStyle:
                description: |-
                  pathStyle selects path-style addressing (https://host/bucket) over
                  virtual-hosted style (default true). It is a pointer so that false
                  survives omitempty. Self-hosted stores only.
                type: boolean
              provider:
                description: |-
                  provider runs the store on a cloud (S3 buckets of an AWS account).
                  Absent means a self-hosted RustFS.
                properties:
                  aws:
                    description: aws is the AWS block, set exactly when type is AWS.
                    properties:
                      endpointOverride:
                        description: |-
                          EndpointOverride points the SDK at an emulator. It is honoured only when
                          the operator runs with EGRESS_MODE=allow-private; otherwise the server is
                          Ready=False with reason EndpointOverrideForbidden. For tests, never for
                          production.
                        maxLength: 2048
                        pattern: ^https?://[^\s]+$
                        type: string
                      iamPath:
                        description: |-
                          iamPath is the IAM path of the users the operator creates for
                          BucketAccess claims, beginning and ending with a slash. Default
                          /craftainer/.
                        maxLength: 512
                        pattern: ^/([!-~]+/)?$
                        type: string
                      permissionsBoundaryARN:
                        description: |-
                          permissionsBoundaryARN is the ARN of a managed policy set as the
                          permissions boundary of those users, so that nothing they are granted
                          can exceed it. Unset means no boundary.
                        maxLength: 2048
                        pattern: ^arn:[a-z-]+:iam::([0-9]{12}|aws):policy/[!-~]+$
                        type: string
                      region:
                        description: Region is the AWS region; the partition follows
                          from it.
                        maxLength: 32
                        pattern: ^[a-z]{2}(-[a-z]+)+-[0-9]+$
                        type: string
                      roleARN:
                        description: RoleARN, when set, is assumed with the source
                          credentials.
                        maxLength: 2048
                        type: string
                        x-kubernetes-validations:
                        - message: 'roleARN must start with arn:'
                          rule: self.startsWith('arn:')
                    required:
                    - region
                    type: object
                  gcp:
                    description: |-
                      gcp is the GCP block, set exactly when type is GCP: the project, and
                      the location buckets are created in (empty is GCS's default, US).
                    properties:
                      endpointOverride:
                        description: EndpointOverride is as on AWSClusterBlock.
                        maxLength: 2048
                        pattern: ^https?://[^\s]+$
                        type: string
                      location:
                        description: Location is the region, required where the resource
                          is regional.
                        maxLength: 64
                        type: string
                      project:
                        description: Project is the project ID.
                        maxLength: 30
                        pattern: ^[a-z][a-z0-9-]{4,28}[a-z0-9]$
                        type: string
                    required:
                    - project
                    type: object
                  type:
                    description: |-
                      type selects the cloud; it cannot change. The schema lists every cloud
                      of lib-operator-go, and the rules above admit only AWS and GCP: Azure
                      comes with its own NKs3 item.
                    enum:
                    - AWS
                    - GCP
                    - Azure
                    type: string
                    x-kubernetes-validations:
                    - message: provider.type is immutable
                      rule: self == oldSelf
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: only AWS and GCP are supported as provider.type
                  rule: self.type == 'AWS' || self.type == 'GCP'
                - message: provider.aws is required when type is AWS, and forbidden
                    otherwise
                  rule: (self.type == 'AWS') == has(self.aws)
                - message: provider.gcp is required when type is GCP, and forbidden
                    otherwise
                  rule: (self.type == 'GCP') == has(self.gcp)
              proxyURL:
                description: |-
                  ProxyURL is an http, https or socks5 proxy; unset uses the process
                  environment.
                maxLength: 512
                type: string
              region:
                description: |-
                  region is the S3 region the store reports (default us-east-1). Self-hosted
                  stores only: a provider names its region in provider.aws.region.
                maxLength: 64
                type: string
              tls:
                description: TLS configures verification of the backend.
                properties:
                  caBundle:
                    description: CABundle replaces the system roots.
                    properties:
                      configMapRef:
                        description: ConfigMapRef is a ConfigMap key holding a PEM
                          bundle.
                        properties:
                          key:
                            default: ca.crt
                            description: Key inside it. Defaults to ca.crt.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret or ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      secretRef:
                        description: SecretRef is a Secret key holding a PEM bundle.
                        properties:
                          key:
                            default: ca.crt
                            description: Key inside it. Defaults to ca.crt.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret or ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of secretRef and configMapRef
                      rule: has(self.secretRef) != has(self.configMapRef)
                  minVersion:
                    default: "1.2"
                    description: MinVersion is the TLS floor.
                    enum:
                    - "1.2"
                    - "1.3"
                    type: string
                  serverName:
                    description: ServerName overrides the host used for certificate
                      verification.
                    maxLength: 253
                    type: string
                type: object
            required:
            - allowedNamespaces
            type: object
            x-kubernetes-validations:
            - message: endpoint is required without a provider
              rule: has(self.provider) || has(self.endpoint)
            - message: adminCredentialsSecretRef is required without a provider
              rule: has(self.provider) || has(self.adminCredentialsSecretRef)
            - message: 'adminCredentialsSecretRef is forbidden with a provider: the
                cloud credential is credentials'
              rule: '!has(self.provider) || !has(self.adminCredentialsSecretRef)'
            - message: region, pathStyle and backend are forbidden with a provider
              rule: '!has(self.provider) || (!has(self.region) && !has(self.pathStyle)
                && !has(self.backend))'
            - message: credentials is allowed only with a provider
              rule: '!has(self.credentials) || has(self.provider)'
            - message: adminCredentialsSecretRef.namespace is required on a cluster-scoped
                store
              rule: '!has(self.adminCredentialsSecretRef) || (has(self.adminCredentialsSecretRef.namespace)
                && size(self.adminCredentialsSecretRef.namespace) > 0)'
            - message: 'provider cannot be added or removed: a store cannot move between
                clouds or between cloud and self-hosted'
              rule: has(self.provider) == has(oldSelf.provider)
          status:
            description: status defines the observed state of ClusterObjectStore
            properties:
              conditions:
                description: Conditions holds Ready and ServerReachable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              discovered:
                additionalProperties:
                  type: string
                description: |-
                  Discovered is what the operator read from the cloud for a cloud server:
                  endpoint, port, resourceId, accountId and region (ADR 0002, section
                  16.1). The probe (a cloud Prober of package probe) or the operator's
                  controller fills it; claims read it from the cached server. A
                  self-hosted server leaves it empty.
                maxProperties: 10
                type: object
                x-kubernetes-validations:
                - message: values are at most 512 characters
                  rule: self.all(k, size(self[k]) <= 512)
              lastProbeTime:
                description: LastProbeTime is when the server was last probed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata.generation last reconciled.
                format: int64
                type: integer
              serverVersion:
                description: ServerVersion is the version the backend reported.
                maxLength: 64
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
