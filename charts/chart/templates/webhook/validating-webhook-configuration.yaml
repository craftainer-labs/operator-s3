{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    {{- if .Values.certManager.enabled }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "operator-s3.resourceName" (dict "suffix" "serving-cert" "context" $) }}
    {{- end }}
  name: {{ include "operator-s3.resourceName" (dict "suffix" "validating-webhook-configuration" "context" $) }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "operator-s3.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-s3-craftainer-dev-v1alpha1-bucket
  failurePolicy: Fail
  name: vbucket-v1alpha1.kb.io
  rules:
  - apiGroups:
    - s3.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - buckets
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "operator-s3.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-s3-craftainer-dev-v1alpha1-bucketaccess
  failurePolicy: Fail
  name: vbucketaccess-v1alpha1.kb.io
  rules:
  - apiGroups:
    - s3.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - bucketaccesses
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "operator-s3.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-s3-craftainer-dev-v1alpha1-clusterobjectstore
  failurePolicy: Fail
  name: vclusterobjectstore-v1alpha1.kb.io
  rules:
  - apiGroups:
    - s3.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clusterobjectstores
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "operator-s3.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-s3-craftainer-dev-v1alpha1-objectstore
  failurePolicy: Fail
  name: vobjectstore-v1alpha1.kb.io
  rules:
  - apiGroups:
    - s3.craftainer.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - objectstores
  sideEffects: None
{{- end }}
