apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "operator-s3.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - s3.craftainer.dev
  resources:
  - bucketaccesses
  - buckets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - s3.craftainer.dev
  resources:
  - bucketaccesses/finalizers
  - buckets/finalizers
  verbs:
  - update
- apiGroups:
  - s3.craftainer.dev
  resources:
  - bucketaccesses/status
  - buckets/status
  - clusterobjectstores/status
  - objectstores/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - s3.craftainer.dev
  resources:
  - clusterobjectstores
  - objectstores
  verbs:
  - get
  - list
  - watch
