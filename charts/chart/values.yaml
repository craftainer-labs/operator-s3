## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Values shared by every chart that adds this one as a dependency
##
global:
  ## Registry host (and optional path prefix) to pull the manager image from,
  ## e.g. an internal mirror for an air-gapped cluster. Replaces
  ## manager.image.registry. Empty: use manager.image.registry.
  imageRegistry: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    ## The image is <registry>/<repository>@<digest>, or :<tag> when no digest
    ## is set. The release workflow publishes the chart with the digest of the
    ## signed image index filled in, so a released chart pins its image.
    registry: ghcr.io
    repository: craftainer-labs/operator-s3
    ## Image digest, "sha256:<64 hex>"; wins over tag
    digest: ""
    ## Image tag (defaults to Chart.appVersion if not set and no digest)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Extra environment variables for the manager container (EB-5). POD_NAMESPACE,
  ## EGRESS_MODE and DEFAULT_DATA_DELETION_POLICY are set by the chart (use
  ## egressMode and defaultDataDeletionPolicy); the schema rejects them here.
  ## E.g. HTTP(S)_PROXY and NO_PROXY for the Kubernetes API client, or
  ## SSL_CERT_FILE with a custom CA bundle mounted through extraVolumes and
  ## extraVolumeMounts. The operator makes no outbound call of its own: it talks
  ## to the Kubernetes API and to the object stores named by the store kinds, and
  ## it never reads HTTP(S)_PROXY for those. A store's own proxy and CA bundle
  ## are set on the store object (spec.proxyURL, spec.tls.caBundle), not here.
  ## Note that HTTPS_PROXY also applies to the API client, so list the API
  ## server in NO_PROXY.
  ##
  extraEnv: []
  # extraEnv:
  #   - name: NO_PROXY
  #     value: .svc,.cluster.local,10.0.0.0/8

  ## Extra volumes and mounts for the manager, e.g. a custom CA bundle.
  ##
  # extraVolumes: []
  # extraVolumeMounts: []

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## Which destinations the operator's connections to object stores (and their
## proxies) may not reach. The operator dials every store itself, so this is its
## SSRF guard.
## - strict (default): loopback, link-local, cloud metadata and the private
##   ranges (RFC 1918, CGNAT, unique-local) are refused.
## - allow-private: the private ranges are allowed; loopback, link-local and
##   cloud metadata stay refused. Choose it when a store (such as an in-cluster
##   RustFS Service) or a proxy lives on a private address, which is the usual
##   case inside a cluster.
## Rendered as the manager's EGRESS_MODE.
##
egressMode: strict

## The deletionPolicy a new Bucket is pinned to when its spec leaves it unset:
## Retain (default; the bucket and its objects stay when the claim goes) or
## Delete. Rendered as the manager's DEFAULT_DATA_DELETION_POLICY.
##
defaultDataDeletionPolicy: Retain

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: true

## Webhook server configuration
##
webhook:
  enabled: true
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false
